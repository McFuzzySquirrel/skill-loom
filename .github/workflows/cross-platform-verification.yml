name: Cross-platform verification

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Runner platform
        type: choice
        default: all
        options: [all, ubuntu-latest, macos-latest, windows-latest]
      suite:
        description: Test scope
        type: choice
        default: full
        options: [full, claims, portable, workspaces, terminal]

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - if: inputs.suite == 'full'
        run: npm test
      - if: inputs.suite == 'claims'
        run: npx vitest run tests/unit/project-claim.test.ts
      - if: inputs.suite == 'portable'
        run: npx vitest run tests/unit/portable-runtime.test.ts
      - if: inputs.suite == 'workspaces'
        run: npx vitest run tests/unit/test-workspaces.test.ts tests/integration/test-workspace-routes.test.ts
      - if: inputs.suite == 'terminal'
        run: npx vitest run tests/unit/pty.test.ts tests/unit/supervised-runner.test.ts tests/integration/terminal-ws.test.ts
